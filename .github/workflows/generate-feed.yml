name: Mirror Upstream Feeds & Publish Digest

on:
  schedule:
    # Daily at 6 AM IST (00:30 UTC)
    - cron: '30 0 * * *'
    # Backup trigger at 7 AM IST in case GitHub skips the first one
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      skip_digest:
        description: 'Skip digest generation (just mirror feeds)'
        required: false
        default: false
        type: boolean
      backfill:
        description: 'Backfill all old digests with current prompt'
        required: false
        default: false
        type: boolean
      force_digest:
        description: 'Regenerate and resend even if today already has a digest'
        required: false
        default: false
        type: boolean

# Serialize runs so two triggers can never both pass the already-published check.
concurrency:
  group: publish-digest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPSTREAM_RAW_BASE_URL: https://raw.githubusercontent.com/zarazhangrui/follow-builders/main
      FOLLOW_BUILDERS_SUBSCRIBE_URL: https://buttondown.com/api/emails/soumyo

    steps:
      - uses: actions/checkout@v4

      # Three triggers fire daily (two crons + the fallback workflow). Only the
      # first should publish; the rest still mirror feeds, but must not generate
      # or send a second digest. history/<date>.md is the same signal
      # digest-fallback.yml uses, and is written by the run that publishes.
      - name: Check whether today's digest was already published
        id: guard
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -f "history/${TODAY}.md" ] && [ "${{ github.event.inputs.force_digest }}" != "true" ]; then
            echo "Digest for ${TODAY} already published — skipping generation and send."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm run setup

      - name: Mirror feeds from upstream repo
        run: |
          echo "Mirroring feed snapshots from upstream..."
          curl -sf "$UPSTREAM_RAW_BASE_URL/feed-x.json" -o feed-x.json
          curl -sf "$UPSTREAM_RAW_BASE_URL/feed-podcasts.json" -o feed-podcasts.json
          curl -sf "$UPSTREAM_RAW_BASE_URL/feed-blogs.json" -o feed-blogs.json

      - name: Fetch additional official, editorial, and China-focused sources
        continue-on-error: true
        run: cd scripts && node fetch-external-sources.js

      - name: Validate mirrored feeds
        run: npm run verify:feeds

      - name: Build structured history
        run: npm run build:structured

      - name: Generate digest
        if: ${{ github.event.inputs.skip_digest != 'true' && steps.guard.outputs.publish == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd scripts && node generate-digest.js > /tmp/digest.md
          echo "--- Digest preview (first 500 chars) ---"
          head -c 500 /tmp/digest.md

      - name: Save history
        if: ${{ github.event.inputs.skip_digest != 'true' && steps.guard.outputs.publish == 'true' }}
        run: |
          cd scripts && node save-history.js --file /tmp/digest.md

      - name: Enrich structured data with editorial Why-it-matters
        if: ${{ github.event.inputs.skip_digest != 'true' && steps.guard.outputs.publish == 'true' }}
        run: node scripts/enrich-structured-data.js --file /tmp/digest.md

      - name: Backfill old digests
        if: ${{ github.event.inputs.backfill == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/backfill-digests.js

      - name: Sync site data
        run: npm --prefix scripts run sync-site-data

      - name: Publish newsletter
        if: ${{ github.event.inputs.skip_digest != 'true' && steps.guard.outputs.publish == 'true' }}
        continue-on-error: true
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          cd scripts && node publish-newsletter.js --file /tmp/digest.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-x.json feed-podcasts.json feed-blogs.json feed-external.json state-feed.json history/ site/data/
          git diff --cached --quiet || git commit -m "chore: mirror feeds and refresh digest"
          git push
